server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  # 1 MB más que el límite de la galería (10 MB): así una imagen muy grande
  # la rechaza la API con su 413 en JSON y no Nginx con una página HTML.
  client_max_body_size 11m;

  location /api/ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /archivos/ {
    proxy_pass http://backend:3000;
  }

  # Swagger: el puerto 3000 de la API no se publica, así que la documentación también pasa por aquí
  location /docs {
    proxy_pass http://backend:3000;
  }

  location / {
    try_files $uri /index.html;
  }
}